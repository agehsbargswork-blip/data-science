name: Test densmix Shiny modules

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/test-densmix-shiny-modules.yml

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/shiny-r-multinom

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::matrixStats
            any::shiny

      - name: Install densmix
        run: R CMD INSTALL R/densmix

      - name: Smoke-test app and both models
        shell: Rscript {0}
        run: |
          app_dir <- "R/densmix-shiny"
          original_dir <- getwd()
          setwd(app_dir)
          on.exit(setwd(original_dir), add = TRUE)

          app <- source("app.R", local = new.env())$value
          stopifnot(inherits(app, "shiny.appobj"))

          set.seed(123)
          exp_data <- densmix::gen_exp_normal(
            size = 100,
            parameters = list(
              weight = 0.5,
              lambda = 0.6,
              mu = 10,
              sigma = 2
            )
          )
          exp_fit <- densmix::fit_exp_normal(exp_data)
          stopifnot(inherits(exp_fit, "em_exp_normal_fit"))

          generated <- densmix::gen_em_mn(
            size = 200,
            params = list(
              n_components = 3,
              n_buckets = 6,
              dirichlet = rep(1, 6),
              component_weights = rep(1 / 3, 3),
              n_actions_per_bucket = list(
                max_actions = 100,
                prob_action = 0.5
              )
            )
          )
          multinomial_fit <- densmix::fit_multinomial(
            generated$data,
            n_components = 3
          )

          stopifnot(
            inherits(multinomial_fit, "em_multinomial_fit"),
            isTRUE(multinomial_fit$converged),
            all(is.finite(multinomial_fit$weights)),
            all(is.finite(multinomial_fit$mixture_profiles))
          )
